<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Athlete community and impact: an athlete with a speech bubble connected to a community" xmlns:c2pa="http://c2pa.org/manifest"><style>.n{stroke:#0b1b2b;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.nf{fill:#0b1b2b}.g{stroke:#C9A84C;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.gf{fill:#C9A84C}
@keyframes grow{0%,15%{transform:scaleY(.15)}45%,85%{transform:scaleY(1)}100%{transform:scaleY(.15)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes point{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sweep{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,4px)}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:grow 4s ease-in-out infinite}.b2{animation-delay:.25s}.b3{animation-delay:.5s}
.bob{animation:bob 2s ease-in-out infinite}.bob2{animation-delay:.6s}
.arm{transform-box:fill-box;transform-origin:right center;animation:point 3s ease-in-out infinite}
.dot{animation:pulse 1.6s ease-in-out infinite}.d2{animation-delay:.3s}.d3{animation-delay:.6s}
.mag{animation:sweep 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><circle cx="60" cy="60" r="58" fill="#F9F8F6" stroke="#E8E6E1" stroke-width="2"/>
<path d="M62 76 L83 88 M62 76 L96 74" class="g" stroke-width="2.5" stroke-dasharray="2 5"/>
<circle cx="86" cy="90" r="6" class="nf"/><circle cx="98" cy="72" r="6" class="nf"/>
<circle cx="46" cy="52" r="9.5" class="nf"/>
<path d="M46 62 V84 M46 84 L38 102 M46 84 L54 102 M46 68 L32 76 M46 68 L60 74" class="n"/>
<circle cx="29" cy="79" r="6" class="gf"/>
<rect x="56" y="22" width="44" height="28" rx="8" class="gf"/>
<path d="M62 50 L60 60 L72 50 Z" class="gf"/>
<circle class="dot" cx="70" cy="36" r="3.2" fill="#fff"/><circle class="dot d2" cx="78" cy="36" r="3.2" fill="#fff"/><circle class="dot d3" cx="86" cy="36" r="3.2" fill="#fff"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
