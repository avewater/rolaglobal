<path d="M36 40 L31 50 H41 Z M60 40 L55 50 H65 Z" class="g" stroke-width="2.5"/>
<line x1="42" y1="60" x2="54" y2="60" class="g"/>
<circle cx="94" cy="42" r="7.5" class="nf"/>
<path d="M94 50 V72 M94 72 L88 88 M94 72 L100 88" class="n"/>
<g class="arm"><path d="M94 56 L81 50" class="n"/></g>
<g class="bob"><circle cx="34" cy="86" r="6.5" class="nf"/><path d="M26 100 Q34 91 42 100" class="n" stroke-width="3"/></g>
